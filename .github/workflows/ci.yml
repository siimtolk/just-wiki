name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pytest --with ruff --with-editable . ruff check src tests
      - run: uv run --with pytest --with-editable . pytest -q
      - run: scripts/privacy-scan.sh
